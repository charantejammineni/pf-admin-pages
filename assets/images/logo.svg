<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Fish / Ocean Wave Icon Mark -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="10" fill="url(#brandGrad)" />
    <!-- Dynamic Fish Shape with water trail -->
    <path d="M12 24 C14 16, 26 14, 32 20 C28 22, 28 26, 32 28 C26 34, 14 32, 12 24 Z" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="17" cy="22" r="1.75" fill="#0369A1" />
    <path d="M26 18 C28 21, 28 27, 26 30" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M10 20 C8 22, 8 26, 10 28" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- PondFish Brand Typography -->
  <text x="54" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="-0.3">Pond<tspan fill="#38BDF8">Fish</tspan></text>
  <text x="55" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#94A3B8" letter-spacing="1.2">ADMIN OPERATIONS</text>
  
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284C7"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
</svg>

